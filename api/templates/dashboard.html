<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Concord</title>
<meta name="description" content="Concord — AI DevSecOps orchestration dashboard">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%231C9C76'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%230D0D0F'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0c0d10;--surface:#131419;--surface-2:#1a1c22;--surface-3:#22242c;
  --border:#2a2d36;--border-strong:#3a3e4a;
  --text:#e6e6e3;--text-2:#a9a9b0;--muted:#74747d;
  --brand:#1fa37b;--brand-2:#2cc592;--brand-bg:rgba(31,163,123,.12);
  --crit:#f0525a;--high:#f58a3c;--med:#e5b83a;--low:#46c47e;--info:#8b8b94;
  --crit-bg:rgba(240,82,90,.13);--high-bg:rgba(245,138,60,.13);
  --med-bg:rgba(229,184,58,.13);--low-bg:rgba(70,196,126,.13);--info-bg:rgba(139,139,148,.13);
  --blue:#5b9cf5;--blue-bg:rgba(91,156,245,.13);
  --focus:0 0 0 2px var(--bg),0 0 0 4px var(--brand-2);
  --r:8px;--r-sm:5px;
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);
  font:13px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit}
:focus-visible{outline:none;box-shadow:var(--focus);border-radius:var(--r-sm)}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}.dim{color:var(--text-2)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ── Header ─────────────────────────────── */
.hdr{display:flex;align-items:center;gap:var(--s4);padding:0 var(--s4);
  height:52px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.logo{display:flex;align-items:center;gap:var(--s2);font-weight:700;font-size:15px;
  letter-spacing:.01em;flex-shrink:0}
.logo-dot{width:10px;height:10px;border-radius:50%;background:var(--brand);
  box-shadow:0 0 0 3px var(--brand-bg)}
.tabs{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--text-2);padding:6px 10px;border-radius:var(--r-sm);
  cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tab:hover{color:var(--text);background:var(--surface-2)}
.tab[aria-selected="true"]{color:#fff;background:var(--brand-bg);
  box-shadow:inset 0 0 0 1px rgba(31,163,123,.45)}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;
  font-weight:700;display:inline-flex;align-items:center;justify-content:center;
  background:var(--med-bg);color:var(--med)}
.badge:empty{display:none}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:var(--s2);flex-shrink:0}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);
  background:var(--surface-2);border-radius:999px;padding:2px 10px;font-size:12px;
  color:var(--text-2);white-space:nowrap}
.pill .d{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.pill.ok .d{background:var(--low)}.pill.bad .d{background:var(--crit)}
.pill.warn .d{background:var(--med)}
.btn{border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text);
  border-radius:var(--r-sm);padding:6px 12px;cursor:pointer;font-weight:600;
  display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--surface-3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--brand-2)}
.btn.danger{color:var(--crit);border-color:rgba(240,82,90,.45)}
.btn.danger:hover:not(:disabled){background:var(--crit-bg)}
.btn.sm{padding:3px 9px;font-size:12px}
.spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;
  border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:980px){.hdr-right .pill.hide-sm{display:none}}

/* ── Banners ─────────────────────────────── */
.banner{display:none;align-items:center;gap:var(--s3);padding:var(--s2) var(--s4);
  border-bottom:1px solid var(--border);font-size:13px;flex-shrink:0}
.banner.show{display:flex}
.banner.err{background:var(--crit-bg);color:#ffd7d9}
.banner.warn{background:var(--med-bg);color:#f7e6b8}
.banner input{background:var(--bg);border:1px solid var(--border-strong);color:var(--text);
  border-radius:var(--r-sm);padding:5px 8px;width:260px;font-family:var(--mono)}

/* ── Layout ─────────────────────────────── */
.layout{display:flex;flex:1;min-height:0}
.side{width:232px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);
  overflow-y:auto;padding:var(--s4) var(--s3);display:flex;flex-direction:column;gap:var(--s5)}
@media (max-width:860px){.side{display:none}}
.side h2,.section-title{font-size:11px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);margin-bottom:var(--s2)}
.agent{display:flex;gap:var(--s2);align-items:flex-start;padding:6px var(--s2);
  border-radius:var(--r-sm)}
.agent+.agent{margin-top:2px}
.agent .d{width:8px;height:8px;border-radius:50%;margin-top:6px;flex-shrink:0}
.agent.active .d{background:var(--low)}.agent.blocked .d{background:var(--crit)}
.agent .n{font-weight:600}
.agent .s{font-size:12px;color:var(--muted);line-height:1.4;word-break:break-word}
.agent.blocked .n{color:var(--text-2)}
.kvs{display:grid;grid-template-columns:auto 1fr;gap:4px var(--s3);font-size:13px}
.kvs dt{color:var(--muted)}.kvs dd{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.scanbox{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);
  padding:var(--s3);font-size:12px;color:var(--text-2);line-height:1.6;word-break:break-word}
.scanbox b{color:var(--text)}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.view{display:none;flex:1;min-height:0}
.view.active{display:flex}
.pane{flex:1;min-width:0;overflow:auto;padding:var(--s5)}
.pane-hdr{display:flex;align-items:center;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.pane-hdr h1{font-size:16px;font-weight:650}
.pane-hdr .sub{color:var(--muted);font-size:12px}
.pane-hdr .grow{flex:1}

/* ── Cards / stats ─────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--s3);
  margin-bottom:var(--s5)}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:var(--s4)}
.stat .k{color:var(--muted);font-size:12px}
.stat .v{font-size:28px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.stat.attn .v{color:var(--med)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:var(--s3)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:var(--s4);min-width:0}
.card h3{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:var(--s3)}
.row{display:flex;justify-content:space-between;gap:var(--s3);padding:7px 0;
  border-bottom:1px solid var(--surface-2)}
.row:last-child{border-bottom:0}
.row .r{color:var(--text-2);text-align:right;min-width:0;overflow-wrap:anywhere}

/* ── Chips ─────────────────────────────── */
.sev{display:inline-block;font-size:11px;font-weight:700;padding:1px 7px;border-radius:4px;
  letter-spacing:.02em;white-space:nowrap}
.sev-CRITICAL{background:var(--crit-bg);color:var(--crit)}
.sev-HIGH{background:var(--high-bg);color:var(--high)}
.sev-MEDIUM{background:var(--med-bg);color:var(--med)}
.sev-LOW{background:var(--low-bg);color:var(--low)}
.sev-INFORMATIONAL,.sev-x{background:var(--info-bg);color:var(--info)}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-pending{color:var(--med)}.st-approved,.st-auto{color:var(--low)}
.st-rejected,.st-error{color:var(--crit)}.st-fast,.st-expired{color:var(--info)}
.chip{display:inline-block;font-size:11px;padding:1px 7px;border-radius:4px;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text-2);white-space:nowrap}
.chip.ai{color:var(--blue);border-color:rgba(91,156,245,.35)}

/* ── Findings split view ───────────────── */
.split{display:flex;flex:1;min-width:0}
.list{width:380px;flex-shrink:0;border-right:1px solid var(--border);display:flex;
  flex-direction:column;min-height:0}
@media (max-width:1100px){.list{width:320px}}
.list-tools{display:flex;gap:var(--s2);padding:var(--s3);border-bottom:1px solid var(--border)}
.list-tools input,.list-tools select{background:var(--surface-2);border:1px solid var(--border);
  color:var(--text);border-radius:var(--r-sm);padding:5px 8px;min-width:0}
.list-tools input{flex:1}
.items{flex:1;overflow-y:auto;padding:var(--s2)}
.item{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
  border-radius:var(--r-sm);padding:var(--s2) var(--s3);cursor:pointer}
.item+.item{margin-top:2px}
.item:hover{background:var(--surface-2)}
.item[aria-selected="true"]{background:var(--brand-bg);border-color:rgba(31,163,123,.5)}
.item .t1{display:flex;align-items:center;gap:var(--s2)}
.item .id{font-family:var(--mono);font-size:12px;font-weight:600;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .when{font-size:12px;color:var(--muted);white-space:nowrap}
.item .t2{display:flex;align-items:center;gap:var(--s2);margin-top:4px;font-size:12px;
  color:var(--muted);min-width:0}
.item .t2 .art{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}
.detail{flex:1;min-width:0;overflow-y:auto;padding:var(--s5)}
.dl{display:grid;grid-template-columns:130px 1fr;gap:6px var(--s4);margin-bottom:var(--s5)}
.dl dt{color:var(--muted)}.dl dd{min-width:0;overflow-wrap:anywhere}
.agents-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:var(--s3);
  margin-bottom:var(--s5)}
.acard{border:1px solid var(--border);border-radius:var(--r);background:var(--surface);
  padding:var(--s3) var(--s4);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.acard.win{border-color:rgba(31,163,123,.55)}
.acard .h{display:flex;align-items:center;gap:var(--s2)}
.acard .score{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--text-2)}
.acard pre,.comment{white-space:pre-wrap;word-break:break-word;font-family:var(--mono);
  font-size:12px;line-height:1.55;color:var(--text-2);max-height:220px;overflow:auto}
.comment{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
  padding:var(--s3) var(--s4);max-height:none;margin-bottom:var(--s5)}
.decision{border:1px solid rgba(229,184,58,.4);background:rgba(229,184,58,.06);
  border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s5)}
.decision h3{color:var(--med);font-size:14px;margin-bottom:var(--s1)}
.decision p{color:var(--text-2);margin-bottom:var(--s3)}
.decision .acts{display:flex;flex-wrap:wrap;gap:var(--s2)}
.resolved{border:1px solid rgba(70,196,126,.35);background:var(--low-bg);border-radius:var(--r);
  padding:var(--s3) var(--s4);margin-bottom:var(--s5);color:#c9f0d9}
.resolved.rej{border-color:rgba(240,82,90,.4);background:var(--crit-bg);color:#ffd7d9}
.resolved a{color:var(--brand-2)}
.skips{list-style:none;margin-bottom:var(--s5);display:flex;flex-direction:column;gap:4px}
.skips li{font-size:12px;color:var(--text-2)}
.skips b{color:var(--text)}
h2.sh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin-bottom:var(--s2)}

/* ── Tables ────────────────────────────── */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;padding:8px 10px;
  border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);white-space:nowrap}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--surface-2);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface)}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums}
.tbl-wrap{border:1px solid var(--border);border-radius:var(--r);overflow:auto;max-height:100%}
.tbl .acts{display:flex;gap:6px;flex-wrap:wrap}

/* ── Severity bars ─────────────────────── */
.bar-row{display:grid;grid-template-columns:120px 1fr 56px;gap:var(--s3);align-items:center;
  margin:var(--s2) 0}
.bar{height:22px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}

/* ── Empty / loading ───────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:var(--s2);color:var(--muted);padding:var(--s6) var(--s4);min-height:220px}
.empty .big{font-size:28px;opacity:.35}
.empty b{color:var(--text)}
.skel{background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));
  background-size:200% 100%;animation:sk 1.2s infinite;border-radius:4px;height:14px}
@keyframes sk{to{background-position:-200% 0}}

.toast{position:fixed;right:var(--s4);bottom:var(--s4);max-width:420px;padding:10px 14px;
  border-radius:var(--r);font-weight:600;font-size:13px;opacity:0;transform:translateY(8px);
  transition:opacity .2s,transform .2s;pointer-events:none;z-index:50;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:none}
.toast.ok{background:#15372b;color:#c9f0d9;border:1px solid rgba(70,196,126,.4)}
.toast.err{background:#3a1619;color:#ffd7d9;border:1px solid rgba(240,82,90,.45)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--border-strong);
  border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--text-2)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo"><span class="logo-dot" aria-hidden="true"></span>Concord</div>
  <nav class="tabs" role="tablist" aria-label="Views" id="tabs"></nav>
  <div class="hdr-right">
    <button class="btn primary" id="scan-btn" type="button" disabled>Scan</button>
    <span class="pill hide-sm" id="llm-pill" title="LLM provider used for PR-comment wording">LLM —</span>
    <span class="pill" id="api-pill" role="status"><span class="d"></span><span>Connecting…</span></span>
  </div>
</header>

<div class="banner err" id="auth-banner" role="alert">
  <span>This server requires an API key.</span>
  <form id="key-form" style="display:flex;gap:8px;align-items:center">
    <label class="sr-only" for="key-input">API key</label>
    <input id="key-input" type="password" autocomplete="off" placeholder="CONCORD_API_KEY">
    <button class="btn sm primary" type="submit">Use key</button>
  </form>
  <span class="dim" style="font-size:12px">Kept in this browser tab only (sessionStorage).</span>
</div>
<div class="banner err" id="down-banner" role="alert"></div>

<div class="layout">
  <aside class="side" aria-label="Status">
    <section><h2>Agents</h2><div id="side-agents"><div class="skel"></div></div></section>
    <section><h2>Findings</h2>
      <dl class="kvs" id="side-stats">
        <dt>Total</dt><dd>—</dd><dt>Fast path</dt><dd>—</dd>
        <dt>AI path</dt><dd>—</dd><dt>Awaiting decision</dt><dd>—</dd>
      </dl>
    </section>
    <section><h2>Last scan</h2><div class="scanbox" id="side-scan">—</div></section>
    <section class="muted" style="font-size:12px;margin-top:auto">
      Keys: <kbd>1</kbd>–<kbd>7</kbd> views · <kbd>j</kbd>/<kbd>k</kbd> move ·
      <kbd>/</kbd> filter · <kbd>r</kbd> refresh
    </section>
  </aside>

  <main class="main" id="main">
    <section class="view" id="view-overview" role="tabpanel" aria-labelledby="tab-overview"></section>
    <section class="view" id="view-findings" role="tabpanel" aria-labelledby="tab-findings">
      <div class="split">
        <div class="list">
          <div class="list-tools">
            <label class="sr-only" for="f-filter">Filter findings</label>
            <input id="f-filter" type="search" placeholder="Filter by id, repo, artifact…">
            <label class="sr-only" for="f-status">Status</label>
            <select id="f-status">
              <option value="">All</option><option value="pending">Awaiting decision</option>
              <option value="resolved">Resolved</option><option value="fast">Fast path</option>
            </select>
          </div>
          <div class="items" id="f-items" role="listbox" aria-label="Findings"></div>
        </div>
        <div class="detail" id="f-detail" aria-live="polite"></div>
      </div>
    </section>
    <section class="view" id="view-approvals" role="tabpanel" aria-labelledby="tab-approvals"></section>
    <section class="view" id="view-incidents" role="tabpanel" aria-labelledby="tab-incidents"></section>
    <section class="view" id="view-security" role="tabpanel" aria-labelledby="tab-security"></section>
    <section class="view" id="view-audit" role="tabpanel" aria-labelledby="tab-audit"></section>
    <section class="view" id="view-settings" role="tabpanel" aria-labelledby="tab-settings"></section>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// Every value on this page comes from the live API. Nothing is hardcoded or
// simulated; when the API has no data the views say so.

const VIEWS = [
  ['overview', 'Overview'], ['findings', 'Findings'], ['approvals', 'Approvals'],
  ['incidents', 'Incidents'], ['security', 'Security'], ['audit', 'Audit'],
  ['settings', 'Settings'],
];
const SEV_ORDER = ['CRITICAL', 'HIGH', 'MEDIUM', 'LOW', 'INFORMATIONAL'];
const AGENT_NAME = {infra: 'Infra', cicd: 'CI/CD', security: 'Security',
  kubernetes: 'Kubernetes', observability: 'Observability'};
const agentName = d => AGENT_NAME[d] || d;
const SEV_VAR = {CRITICAL:'--crit', HIGH:'--high', MEDIUM:'--med', LOW:'--low', INFORMATIONAL:'--info'};
const POLL_MS = 5000;

const S = {             // one snapshot shared by every view
  view: 'overview', selected: null, loaded: false, online: null, needKey: false,
  findings: [], stats: null, pending: [], agents: null, scan: null, health: null,
  version: null, llm: null, detail: {}, audit: null, incidents: null, severity: null,
  busy: new Set(),
};
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sevChip = s => {
  const k = SEV_ORDER.includes(s) ? s : 'x';
  return `<span class="sev sev-${k}">${esc(s || '?')}</span>`;
};
const lastPart = p => String(p || '').replace(/\\/g, '/').split('/').filter(Boolean).pop() || '—';

// ── Time: ISO strings from the API already carry an offset (+00:00) ─────
function parseTs(ts) {
  if (!ts) return null;
  const hasZone = /([zZ]|[+-]\d\d:?\d\d)$/.test(ts);
  const d = new Date(hasZone ? ts : ts + 'Z');     // naive values are UTC
  return isNaN(d) ? null : d;
}
function ago(ts) {
  const d = parseTs(ts); if (!d) return '—';
  const s = Math.max(0, (Date.now() - d.getTime()) / 1000);
  if (s < 45) return 'just now';
  if (s < 3600) return Math.round(s / 60) + 'm ago';
  if (s < 86400) return Math.round(s / 3600) + 'h ago';
  return Math.round(s / 86400) + 'd ago';
}
function fullTime(ts) {
  const d = parseTs(ts);
  return d ? d.toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'medium'}) : '—';
}
const timeEl = ts => `<time datetime="${esc(ts)}" title="${esc(fullTime(ts))}">${esc(ago(ts))}</time>`;

// ── Finding status (single definition used by every view) ─────────────
function status(f) {
  const r = (f && f.result) || {};
  if (r.approved_by) return {k: 'approved', label: 'Approved · ' + r.approved_by};
  if (r.rejected) return {k: 'rejected', label: 'Rejected'};
  if (r.expired) return {k: 'expired', label: 'Expired'};
  if (r.error) return {k: 'error', label: 'No agent result'};
  if (r.auto_resolved === false) return {k: 'pending', label: 'Awaiting decision'};
  if (r.auto_resolved === true) return {k: 'auto', label: 'Auto-resolved'};
  return {k: 'fast', label: 'Fast path'};
}
const statusChip = f => { const s = status(f); return `<span class="st st-${s.k}">${esc(s.label)}</span>`; };

// ── API ────────────────────────────────────────────────────────────────
function apiKey() { try { return sessionStorage.getItem('concord.key') || ''; } catch { return ''; } }
class ApiError extends Error { constructor(status, detail) { super(detail); this.status = status; } }
async function api(path, opts = {}) {
  const headers = Object.assign({}, opts.headers || {});
  const key = apiKey(); if (key) headers['X-API-Key'] = key;
  let r;
  try { r = await fetch(path, Object.assign({}, opts, {headers})); }
  catch (e) { throw new ApiError(0, 'API unreachable'); }
  let body = null;
  try { body = await r.json(); } catch { /* non-JSON */ }
  if (!r.ok) {
    let detail = body && body.detail;
    if (Array.isArray(detail)) detail = detail.map(d => d.msg).join('; ');
    throw new ApiError(r.status, detail || ('HTTP ' + r.status));
  }
  return body;
}

// ── Toast ──────────────────────────────────────────────────────────────
let toastTimer;
function toast(msg, kind = 'ok', ms = 3500) {
  const el = $('toast');
  el.textContent = msg; el.className = `toast ${kind} show`;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

// ── Data refresh ───────────────────────────────────────────────────────
let refreshing = false;
async function refresh() {
  if (refreshing) return; refreshing = true;
  try {
    const [f, p, a, sc, h] = await Promise.all([
      api('/findings/?limit=500'), api('/events/approvals/pending?limit=500'),
      api('/agents/'), api('/events/scan-status'), api('/health'),
    ]);
    S.findings = f.findings; S.stats = f.stats; S.llm = f.llm_provider;
    S.pending = p.pending; S.agents = a; S.scan = sc; S.health = h;
    S.online = true; S.needKey = false; S.loaded = true;
    if (!S.version) S.version = await api('/version').catch(() => null);
    await loadViewData();
    if (S.view === 'findings' && S.selected) await loadDetail(S.selected);
  } catch (e) {
    S.online = e.status !== 0;
    S.needKey = e.status === 401;
    if (!S.needKey && e.status !== 0) toast('Refresh failed: ' + e.message, 'err');
  } finally {
    refreshing = false;
    render();
  }
}
async function loadViewData() {
  if (S.view === 'audit') S.audit = (await api('/audit/?limit=300')).entries;
  if (S.view === 'incidents') S.incidents = (await api('/findings/incidents?limit=200')).incidents;
  if (S.view === 'security') S.severity = (await api('/findings/severity')).by_severity;
}
async function loadDetail(id) {
  try { S.detail[id] = await api('/findings/' + encodeURIComponent(id) + '/detail'); }
  catch (e) { S.detail[id] = {error: e.status === 404 ? 'This finding no longer exists.' : e.message}; }
}

// ── Rendering (idempotent; only touches the DOM when output changes) ──
const lastHtml = {};
function put(id, html) { if (lastHtml[id] !== html) { $(id).innerHTML = html; lastHtml[id] = html; } }

function render() {
  renderChrome(); renderSide();
  if (S.view === 'overview') renderOverview();
  if (S.view === 'findings') renderFindings();
  if (S.view === 'approvals') renderApprovals();
  if (S.view === 'incidents') renderIncidents();
  if (S.view === 'security') renderSecurity();
  if (S.view === 'audit') renderAudit();
  if (S.view === 'settings') renderSettings();
}

function renderChrome() {
  const focusedTab = document.activeElement && document.activeElement.classList.contains('tab')
    ? document.activeElement.id : null;
  put('tabs', VIEWS.map(([k, label], i) =>
    `<button class="tab" role="tab" id="tab-${k}" aria-controls="view-${k}" type="button"
      aria-selected="${S.view === k}" tabindex="${S.view === k ? 0 : -1}" data-view="${k}"
      title="${esc(label)} (${i + 1})">${esc(label)}${k === 'approvals'
        ? `<span class="badge">${S.pending.length || ''}</span>` : ''}</button>`).join(''));
  if (focusedTab && document.activeElement !== $(focusedTab)) $(focusedTab).focus();
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + S.view));

  const pill = $('api-pill');
  const [cls, text] = S.online === null ? ['', 'Connecting…']
    : S.needKey ? ['warn', 'API key needed'] : S.online ? ['ok', 'API online'] : ['bad', 'API offline'];
  pill.className = 'pill ' + cls; pill.lastElementChild.textContent = text;
  $('llm-pill').textContent = 'LLM ' + (S.llm || '—');
  $('auth-banner').classList.toggle('show', S.needKey);
  const down = $('down-banner');
  down.classList.toggle('show', S.online === false);
  down.textContent = S.online === false
    ? 'Cannot reach the Concord API. Showing the last data received; retrying every 5s.' : '';

  const btn = $('scan-btn'), sc = S.scan;
  const scanning = sc && sc.status === 'scanning';
  btn.disabled = !S.loaded || scanning || S.busy.has('scan') || !S.online;
  btn.innerHTML = scanning ? '<span class="spin" aria-hidden="true"></span> Scanning…'
    : 'Scan ' + esc((sc && sc.target) || 'repository');
  btn.title = sc && sc.target ? 'Clone/update and scan ' + sc.target : '';
}

function agentRows(list, compact) {
  if (!list) return '<div class="skel"></div>';
  if (!list.length) return '<div class="muted">No agents reported.</div>';
  return list.map(a => `<div class="agent ${a.status === 'active' ? 'active' : 'blocked'}"
      title="${esc(a.detail)}"><span class="d" aria-hidden="true"></span><div style="min-width:0">
      <div class="n">${esc(agentName(a.domain))} <span class="sr-only">${esc(a.status)}</span></div>
      <div class="s">${esc(a.backing)}${a.status === 'active' ? ' · ' + Number(a.reliability).toFixed(2)
        : ' · <span style="color:var(--crit)">blocked</span>'}</div>
      ${!compact && a.status !== 'active' ? `<div class="s">${esc(a.detail)}</div>` : ''}
    </div></div>`).join('');
}

function scanSummary(sc, long) {
  if (!sc) return '—';
  if (sc.status === 'idle') return `No scan has run since the API started.<br>Target: <b>${esc(sc.target)}</b>`;
  if (sc.status === 'scanning') return `<b>Scanning ${esc(sc.target)}</b><br>${esc(sc.message || '')}`;
  if (sc.status === 'error') return `<b style="color:var(--crit)">Scan failed</b><br>${esc(sc.error || '')}`;
  const parts = Object.entries(sc.by_scanner || {}).map(([k, v]) => `${esc(k)} ${v}`).join(' · ');
  return `<b>${sc.total ?? '—'} violation(s)</b> ${sc.severity ? sevChip(sc.severity) : ''}<br>`
    + (parts ? `<span class="dim">${parts}</span><br>` : '')
    + `${esc(sc.target)} @ <span class="mono">${esc((sc.commit || '').slice(0, 12))}</span><br>`
    + (sc.unchanged ? 'Unchanged commit — existing finding kept.<br>' : '')
    + (sc.needs_approval ? '<span style="color:var(--med)">Awaiting a human decision</span><br>' : '')
    + `${timeEl(sc.finished)}`
    + (long && sc.warnings && sc.warnings.length ? '<br>' + sc.warnings.map(w => '⚠ ' + esc(w)).join('<br>') : '');
}

function renderSide() {
  put('side-agents', agentRows(S.agents && S.agents.agents, true));
  const st = S.stats;
  put('side-stats', st ? `<dt>Total</dt><dd>${st.total}</dd><dt>Fast path</dt><dd>${st.fast}</dd>
    <dt>AI path</dt><dd>${st.ai}</dd><dt>Awaiting decision</dt><dd style="color:${S.pending.length
      ? 'var(--med)' : 'inherit'}">${S.pending.length}</dd>` : lastHtml['side-stats'] || '');

}

function filteredFindings() {
  const q = ($('f-filter').value || '').toLowerCase().trim();
  const want = $('f-status').value;
  return S.findings.filter(f => {
    const k = status(f).k;
    if (want === 'pending' && k !== 'pending') return false;
    if (want === 'resolved' && !['approved', 'rejected', 'expired', 'auto'].includes(k)) return false;
    if (want === 'fast' && k !== 'fast') return false;
    if (!q) return true;
    return [f.id, f.repo, f.artifact, f.source, f.severity, f.agent].some(v => String(v || '').toLowerCase().includes(q));
  });
}

function renderFindings() {
  if (!S.loaded) { put('f-items', '<div style="padding:12px"><div class="skel"></div></div>'); return; }
  const list = filteredFindings();
  put('f-items', list.length ? list.map(f => `
    <button class="item" role="option" type="button" data-id="${esc(f.id)}" aria-selected="${f.id === S.selected}">
      <div class="t1">${sevChip(f.severity)}<span class="id">${esc(f.id)}</span><span class="when">${timeEl(f.timestamp)}</span></div>
      <div class="t2">${statusChip(f)}<span class="art" title="${esc(f.artifact)}">${esc(f.repo || lastPart(f.artifact))}</span></div>
    </button>`).join('')
    : S.findings.length ? emptyState('⌕', 'No matches', 'No finding matches the current filter.')
    : emptyState('◎', 'No findings yet', 'Click <b>Scan</b> in the header to scan the repository, or run <span class="mono">concord invoke</span>.'));
  renderDetail();
}

function renderDetail() {
  const id = S.selected;
  if (!id) return put('f-detail', emptyState('◎', 'Select a finding', 'Pick one from the list (or use <kbd>j</kbd>/<kbd>k</kbd>).'));
  const d = S.detail[id];
  if (!d) return put('f-detail', loadingPane.replace('pane', 'pane" style="padding:0'));
  if (d.error) return put('f-detail', emptyState('!', 'Cannot show this finding', esc(d.error)));
  const f = d.finding, r = f.result || {}, st = status(f);
  const analyses = r.analyses || {};
  const cands = Object.entries(r.agents || {}).sort((a, b) => b[1] - a[1]);
  const scan = r.scan;
  const busy = S.busy.has('decide:' + id);

  let decision = '';
  if (st.k === 'pending') {
    decision = `<div class="decision"><h3>Human decision required</h3>
      <p>The top candidates are closer than the arbitration gap threshold, so Concord will not
      pick one on its own. Choose the agent whose analysis should stand, or reject the finding.</p>
      <div class="acts">${cands.map(([a, s]) =>
        `<button class="btn sm primary" type="button" data-approve="${esc(a)}" ${busy ? 'disabled' : ''}>
          Approve ${esc(agentName(a))} · ${Number(s).toFixed(4)}</button>`).join('')}
        <button class="btn sm danger" type="button" data-reject ${busy ? 'disabled' : ''}>Reject</button></div></div>`;
  } else if (st.k === 'approved') {
    decision = `<div class="resolved">Approved <b>${esc(r.approved_by)}</b> ${timeEl(r.approved_at)}
      ${r.github_url ? ` · <a href="${esc(r.github_url)}" target="_blank" rel="noopener noreferrer">GitHub issue</a>` : ''}</div>`;
  } else if (st.k === 'rejected') {
    decision = `<div class="resolved rej">Rejected ${timeEl(r.rejected_at)} — ${esc(r.reject_reason || '')}</div>`;
  } else if (st.k === 'expired') {
    decision = `<div class="resolved rej">Approval expired ${timeEl(r.expired_at)} without a decision.</div>`;
  }

  const agentCards = Object.entries(analyses).sort((a, b) => b[1].score - a[1].score).map(([a, x]) => `
    <div class="acard ${a === r.agent ? 'win' : ''}">
      <div class="h"><b>${esc(agentName(a))}</b>${a === r.agent ? '<span class="chip ai">top</span>' : ''}
        <span class="score">${Number(x.score).toFixed(4)}</span></div>
      <div class="muted" style="font-size:12px">${esc(x.backend || x.scanner || '')}
        ${x.violations != null ? ' · ' + x.violations + ' violation(s)' : ''}</div>
      <pre>${esc(x.root_cause)}</pre>
      <div><div class="muted" style="font-size:12px">Suggested fix</div><pre>${esc(x.suggested_fix)}</pre></div>
    </div>`).join('');

  const skips = Object.entries(r.skipped_agents || {});
  put('f-detail', `
    <div class="pane-hdr"><h1 class="mono" style="font-size:15px">${esc(f.id)}</h1>${sevChip(f.severity)}${statusChip(f)}</div>
    ${decision}
    <dl class="dl">
      <dt>Repository</dt><dd>${esc(f.repo || '—')}</dd>
      <dt>Artifact</dt><dd class="mono">${esc(f.artifact || '—')}</dd>
      <dt>Source</dt><dd>${esc(f.source || '—')}</dd>
      <dt>Recorded</dt><dd>${esc(fullTime(f.timestamp))} (${esc(ago(f.timestamp))})</dd>
      <dt>Path</dt><dd>${f.path === 'ai_path' ? '<span class="chip ai">AI path</span>' : '<span class="chip">fast path</span>'}
        ${r.reason ? ' <span class="dim">' + esc(r.reason) + '</span>' : ''}</dd>
      ${scan ? `<dt>Scan</dt><dd>${scan.total} violation(s) · ${Object.entries(scan.by_scanner || {}).map(([k, v]) => esc(k) + ' ' + v).join(' · ')}
        · commit <span class="mono">${esc((scan.commit || '').slice(0, 12))}</span></dd>` : ''}
      ${cands.length > 1 ? `<dt>Confidence gap</dt><dd class="mono">${Number(cands[0][1] - cands[1][1]).toFixed(4)}</dd>` : ''}
    </dl>
    ${agentCards ? `<h2 class="sh">Agent analyses</h2><div class="agents-grid">${agentCards}</div>` : ''}
    ${skips.length ? `<h2 class="sh">Agents that did not run</h2><ul class="skips">${skips.map(([a, w]) =>
      `<li><b>${esc(agentName(a))}</b> — ${esc(w)}</li>`).join('')}</ul>` : ''}
    ${r.pr_comment ? `<h2 class="sh">PR comment</h2><div class="comment">${esc(r.pr_comment)}</div>` : ''}
    <h2 class="sh">Audit timeline</h2>
    ${d.timeline.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>When</th><th>Path</th><th>Reason</th><th>Agent</th><th>Correlation</th></tr></thead>
      <tbody>${d.timeline.map(e => `<tr><td>${timeEl(e.timestamp)}</td><td><span class="chip ${e.path === 'ai_path' ? 'ai' : ''}">${esc(e.path)}</span></td>

  ];
  put('view-settings', `<div class="pane">
    <div class="pane-hdr"><h1>Settings</h1><span class="sub">Read-only; configured through environment variables</span></div>
    <div class="grid2">
      <div class="card"><h3>System</h3>${rows.map(([k, val]) => `<div class="row"><span>${esc(k)}</span><span class="r mono">${esc(val)}</span></div>`).join('')}
        ${apiKey() ? '<div style="margin-top:12px"><button class="btn sm" type="button" id="forget-key">Forget API key</button></div>' : ''}</div>
      <div class="card"><h3>Agent backends</h3>${(S.agents.agents || []).map(a => `<div class="row"><span>${esc(agentName(a.domain))}</span>
        <span class="r"><span class="st ${a.status === 'active' ? 'st-approved' : 'st-rejected'}">${esc(a.status)}</span><br>
        <span class="muted" style="font-size:12px">${esc(a.detail)}${a.endpoint ? ' · ' + esc(a.endpoint) : ''}</span></span></div>`).join('')}</div>
    </div>
    <p class="muted" style="margin-top:16px;font-size:12px">Secrets are never shown. See <span class="mono">.env.example</span>,
      <span class="mono">connectors/tools.yaml</span> and <span class="mono">docs/AGENTS_SETUP.md</span>.</p>
  </div>`);
}

// ── Actions ────────────────────────────────────────────────────────────
async function switchView(v, focusTab) {
  if (!VIEWS.some(([k]) => k === v)) return;
  S.view = v;
  try { history.replaceState(null, '', '#' + v + (v === 'findings' && S.selected ? '/' + encodeURIComponent(S.selected) : '')); } catch {}
  render();
  if (focusTab) $('tab-' + v).focus();
  if (S.loaded) { try { await loadViewData(); } catch (e) { toast(e.message, 'err'); } render(); }
}
async function openFinding(id) {
  S.selected = id;
  await switchView('findings');
  await loadDetail(id); render();
  const el = document.querySelector(`.item[data-id="${CSS.escape(id)}"]`);
  if (el) el.scrollIntoView({block: 'nearest'});
}
async function decide(fid, agent) {
  const key = 'decide:' + fid;
  if (S.busy.has(key)) return;
  S.busy.add(key); render();
  try {
    if (agent) {
      const r = await api(`/events/findings/${encodeURIComponent(fid)}/approve/${encodeURIComponent(agent)}`, {method: 'POST'});
      toast(r.message || 'Approved', r.github_error ? 'err' : 'ok', 5000);
    } else {
      await api(`/events/findings/${encodeURIComponent(fid)}/reject`, {method: 'POST'});
      toast('Finding rejected');
    }
  } catch (e) {
    toast((agent ? 'Approval' : 'Rejection') + ' failed: ' + e.message, 'err', 6000);
  } finally {
    S.busy.delete(key);
    await refresh();
    if (S.selected === fid) { await loadDetail(fid); render(); }
  }
}
async function startScan() {
  S.busy.add('scan'); render();
  try {
    S.scan = await api('/events/scan-crms', {method: 'POST'});
    toast('Scan started: ' + S.scan.target);
    pollScan();
  } catch (e) { toast('Could not start scan: ' + e.message, 'err', 6000); }
  finally { S.busy.delete('scan'); render(); }
}
let scanTimer;
function pollScan() {
  clearTimeout(scanTimer);
  scanTimer = setTimeout(async () => {
    try { S.scan = await api('/events/scan-status'); } catch { /* shown by refresh */ }
    render();
    if (S.scan && S.scan.status === 'scanning') return pollScan();
    if (S.scan && S.scan.status === 'done') {
      toast(S.scan.unchanged ? 'No new commit — existing finding kept' : `Scan complete: ${S.scan.total} violation(s)`);
      await refresh();
      if (S.scan.finding_id) openFinding(S.scan.finding_id);
    } else if (S.scan && S.scan.status === 'error') {
      toast('Scan failed: ' + S.scan.error, 'err', 8000); refresh();
    }
  }, 1500);
}

// ── Events ─────────────────────────────────────────────────────────────
document.addEventListener('click', e => {
  const t = e.target.closest('[data-view],[data-id],[data-open],[data-approve],[data-reject],#scan-btn,#forget-key');
  if (!t) return;
  if (t.id === 'scan-btn') return startScan();
  if (t.id === 'forget-key') { try { sessionStorage.removeItem('concord.key'); } catch {} toast('API key forgotten'); return refresh(); }
  if (t.dataset.view) return switchView(t.dataset.view);
  if (t.dataset.open) { e.preventDefault(); return openFinding(t.dataset.open); }
  if (t.dataset.id) return openFinding(t.dataset.id);
  const fid = t.dataset.fid || S.selected;
  if (t.dataset.approve !== undefined) return decide(fid, t.dataset.approve);
  if (t.dataset.reject !== undefined) {
    if (confirm(`Reject ${fid}? This is recorded in the audit log.`)) decide(fid, null);
  }
});
$('f-filter').addEventListener('input', () => renderFindings());
$('f-status').addEventListener('change', () => renderFindings());
$('key-form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('key-input').value.trim();
  if (!v) return;
  try { sessionStorage.setItem('concord.key', v); } catch {}
  $('key-input').value = '';
  refresh();
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (e.key === 'Escape' && typing) { document.activeElement.blur(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= VIEWS.length) { e.preventDefault(); return switchView(VIEWS[n - 1][0], true); }
  if (e.key === 'r') { e.preventDefault(); return refresh(); }
  if (e.key === '/') { e.preventDefault(); if (S.view !== 'findings') switchView('findings'); return $('f-filter').focus(); }
  if ((e.key === 'j' || e.key === 'k') && S.view === 'findings') {
    const list = filteredFindings(); if (!list.length) return;
    let i = list.findIndex(f => f.id === S.selected);
    i = e.key === 'j' ? Math.min(list.length - 1, i + 1) : Math.max(0, i - 1);
    e.preventDefault(); return openFinding(list[i].id);
  }
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && document.activeElement.classList.contains('tab')) {
    const i = VIEWS.findIndex(([k]) => k === S.view);
    const j = (i + (e.key === 'ArrowRight' ? 1 : VIEWS.length - 1)) % VIEWS.length;
    e.preventDefault(); return switchView(VIEWS[j][0], true);
  }
});
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });

// ── Boot ───────────────────────────────────────────────────────────────
(function boot() {
  const [v, id] = (location.hash.slice(1) || '').split('/');
  if (VIEWS.some(([k]) => k === v)) S.view = v;
  if (id) S.selected = decodeURIComponent(id);
  render();
  refresh().then(() => {
    if (S.scan && S.scan.status === 'scanning') pollScan();
  });
  setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
  setInterval(() => document.querySelectorAll('time[datetime]').forEach(t => {
    t.textContent = ago(t.getAttribute('datetime'));
  }), 30000);
})();
</script>
