{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (printf "%s-concord" .Release.Name) }}
  labels:
    app.kubernetes.io/name: concord
    app.kubernetes.io/instance: {{ .Release.Name }}
# Concord's API does not call the Kubernetes API, so the pod sets
# automountServiceAccountToken to false. This SA exists only to give the
# workload a distinct, least-privilege identity with no RBAC bindings.
automountServiceAccountToken: false
{{- end }}